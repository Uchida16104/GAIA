<section class="card bg-base-100 shadow-xl animate__animated animate__fadeIn" aria-label="Music" x-data="{open: true, playing: false, steps: [{id: 1, n: 'C4'}, {id: 2, n: 'E4'}, {id: 3, n: 'G4'}, {id: 4, n: 'C5'}], reorder(k, pos) { const i = this.steps.findIndex(s => s.id == k); const m = this.steps.splice(i, 1)[0]; this.steps.splice(pos, 0, m) }, async play() { await Tone.start(); this.stop(); const synth = new Tone.Synth().toDestination(); new Tone.Sequence((time, note) => synth.triggerAttackRelease(note, '8n', time), this.steps.map(s => s.n), '8n').start(0); Tone.Transport.start(); this.playing = true }, stop() { Tone.Transport.stop(); Tone.Transport.cancel(); this.playing = false }}">
  <header class="flex items-center gap-2 border-b border-base-300 px-3 py-2">
    <iconify-icon icon="mdi:music-note" width="22"></iconify-icon>
    <h2 class="grow font-semibold" x-text="t('music')"></h2>
    <button class="btn btn-ghost btn-xs btn-square" :aria-expanded="open" @click="open = !open"><iconify-icon :icon="open ? 'mdi:window-minimize' : 'mdi:window-maximize'"></iconify-icon></button>
    <button class="btn btn-ghost btn-xs btn-square" :aria-label="t('close')" @click="$root.remove()"><iconify-icon icon="mdi:close"></iconify-icon></button>
  </header>
  <div x-show="open" x-collapse class="p-3">
    <ul class="flex flex-wrap gap-2" x-sort="reorder($item, $position)">
      <template x-for="s in steps" :key="s.id">
        <li x-sort:item="s.id">
          <select class="select select-sm w-20" x-model="s.n" aria-label="Note">
            <option>C4</option><option>D4</option><option>E4</option><option>F4</option><option>G4</option><option>A4</option><option>B4</option><option>C5</option>
          </select>
        </li>
      </template>
    </ul>
    <div class="mt-3 flex gap-2">
      <button class="btn btn-primary btn-sm" @click="play()"><iconify-icon icon="mdi:play"></iconify-icon><span x-text="t('play')"></span></button>
      <button class="btn btn-sm" :disabled="!playing" @click="stop()"><iconify-icon icon="mdi:stop"></iconify-icon><span x-text="t('stop')"></span></button>
    </div>
  </div>
</section>
